<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Murena - BABA JAGA (Cinematic Video)</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0; padding: 0; background-color: #050505; 
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden; font-family: 'VT323', monospace;
        }

        #crt-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 900; pointer-events: none;
            background: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
            background-size: 100% 4px, 4px 100%;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.95; }
            50% { opacity: 1; }
            100% { opacity: 0.98; }
        }

        canvas { display: block; width: 100%; height: 100%; z-index: 10; }
        
        #loading {
            position: absolute; color: #00ff41; font-size: 40px; z-index: 1000;
        }
    </style>
</head>
<body>

    <div id="crt-overlay"></div>
    <div id="loading">CARICAMENTO ASSET IN CORSO...</div>
    <canvas id="visualizer"></canvas>

    <script>
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        const loadingText = document.getElementById('loading');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- 1. ASSET MANAGER (Preloader Intelligente) ---
        const assets = {};
        let loadedCount = 0;
        
        // Elenco essenziale per la sceneggiatura per non appesantire tutto
        const assetNames = [
            'carma-walk', 'carma-run', 'carma-idle',
            'falcon-walk', 'falcon-run', 'falcon-idle',
            'ferraz-walk', 'ferraz-run', 'ferraz-idle',
            'mauri-walk', 'mauri-run', 'mauri-idle',
            'nan-walk', 'nan-run', 'nan-idle',
            'cop-run', 'copzombie-run', 'drogato-idle',
            'baba-idle', 'baba-attack', 
            'murena-idle', 'pigeon-idle',
            'furgone-run', 'furgone-idle',
            'obj-fiery barrel', 'obj-palo'
        ];

        function loadAssets(callback) {
            if(assetNames.length === 0) return callback();
            assetNames.forEach(name => {
                let img = new Image();
                img.src = `assets/${name}.png`;
                img.onload = () => {
                    assets[name] = img;
                    loadedCount++;
                    if (loadedCount === assetNames.length) callback();
                };
                img.onerror = () => {
                    console.warn(`Asset mancante: ${name}.png (Ignorato per evitare crash)`);
                    loadedCount++;
                    if (loadedCount === assetNames.length) callback();
                };
            });
        }

        // --- 2. SISTEMA ATTORI (Sprite Animator) ---
        class Actor {
            constructor(id, x, y, scale = 1) {
                this.id = id; this.x = x; this.y = y; this.scale = scale;
                this.state = 'walk'; this.frame = 0; this.timer = 0;
                this.visible = true; this.flip = false;
            }

            setState(newState) {
                if (this.state !== newState) {
                    this.state = newState; this.frame = 0;
                }
            }

            draw() {
                if (!this.visible) return;
                let imgName = `${this.id}-${this.state}`;
                let img = assets[imgName];
                
                if (!img) {
                    // Fallback se manca un'animazione
                    ctx.fillStyle = 'magenta'; ctx.fillRect(this.x, this.y - 100, 50, 100);
                    return;
                }

                // Autocalcolo Frames: Presume striscia orizzontale (es. 600x100 = 6 frame da 100x100)
                let frameH = img.height;
                let numFrames = Math.max(1, Math.floor(img.width / frameH));
                let frameW = img.width / numFrames;

                // Anima (1 frame ogni 5 tick)
                this.timer++;
                if (this.timer > 5) {
                    this.frame = (this.frame + 1) % numFrames;
                    this.timer = 0;
                }

                ctx.save();
                ctx.translate(this.x + (frameW * this.scale)/2, this.y);
                if (this.flip) ctx.scale(-1, 1);
                
                // Ombra per staccare dal fondo
                ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 10;
                
                ctx.drawImage(img, this.frame * frameW, 0, frameW, frameH, 
                              -(frameW * this.scale)/2, -(frameH * this.scale), 
                              frameW * this.scale, frameH * this.scale);
                ctx.restore();
            }
        }

        // --- 3. REGIA E SCENOGRAFIA ---
        let scene = 1;
        let frameCount = 0;
        let bgScroll = 0;
        let flashAlpha = 0; // Per i cambi di scena magici
        
        // I Nostri Eroi
        const heroes = [
            new Actor('carma', canvas.width * 0.2, canvas.height * 0.8, 1.2),
            new Actor('falcon', canvas.width * 0.28, canvas.height * 0.82, 1.2),
            new Actor('ferraz', canvas.width * 0.35, canvas.height * 0.78, 1.2),
            new Actor('mauri', canvas.width * 0.42, canvas.height * 0.85, 1.2),
            new Actor('nan', canvas.width * 0.5, canvas.height * 0.81, 1.2)
        ];

        // PNG Dinamici
        let cops = [];
        let baba = new Actor('baba', canvas.width + 200, canvas.height * 0.8, 1.5);
        let furgone = new Actor('furgone', -500, canvas.height * 0.85, 2.5);
        
        // Setup Iniziale
        baba.visible = false;
        furgone.visible = false;

        function drawBackgrounds() {
            bgScroll -= 5; // Velocità base scorrimento
            
            // Pavimento Comune (si adatta alla zona)
            let floorY = canvas.height * 0.75;
            
            if (scene === 1 || scene === 4) {
                // MILANO
                ctx.fillStyle = '#111'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                // Grattacieli finti dietro
                ctx.fillStyle = '#222';
                for(let i=0; i<10; i++) {
                    let h = 200 + (Math.sin(i*7)*100);
                    ctx.fillRect(((i*300) + bgScroll*0.5) % (canvas.width+300) - 100, floorY - h, 150, h);
                }
                // Pavimento Milano
                ctx.fillStyle = '#333'; ctx.fillRect(0, floorY, canvas.width, canvas.height - floorY);
                ctx.fillStyle = '#ffcc00'; ctx.font = 'bold 80px VT323'; ctx.globalAlpha = 0.3;
                ctx.fillText(`ZONA ${scene} - MILANO`, (bgScroll % 1000) + canvas.width, floorY + 80);
                ctx.globalAlpha = 1;
            
            } else if (scene === 2) {
                // BOSCHETTO
                ctx.fillStyle = '#0a1a0a'; ctx.fillRect(0, 0, canvas.width, canvas.height); // Verde scurissimo
                // Alberi (Pali)
                if(assets['obj-palo']) {
                    for(let i=0; i<5; i++) {
                        let px = ((i*400) + bgScroll) % (canvas.width+400) - 200;
                        ctx.drawImage(assets['obj-palo'], px, floorY - 300, 50, 300);
                    }
                }
                // Pavimento Fango
                ctx.fillStyle = '#2c1e16'; ctx.fillRect(0, floorY, canvas.width, canvas.height - floorY);
                ctx.fillStyle = '#44ff44'; ctx.font = 'bold 80px VT323'; ctx.globalAlpha = 0.3;
                ctx.fillText("ZONA 2 - BOSCHETTO", (bgScroll % 1000) + canvas.width, floorY + 80);
                ctx.globalAlpha = 1;

            } else if (scene === 3) {
                // METRO & GABBIE
                ctx.fillStyle = '#1a1a2e'; ctx.fillRect(0, 0, canvas.width, canvas.height); // Blu scuro
                
                // Gabbie Bizzarre in Parallasse
                let spacing = 600;
                let creatures = ['murena-idle', 'pigeon-idle', 'drogato-idle'];
                for(let i=0; i<3; i++) {
                    let cx = ((i*spacing) + bgScroll*0.8) % (canvas.width+spacing) - 200;
                    
                    // Disegna creatura
                    let cImg = assets[creatures[i]];
                    if(cImg) {
                        let cW = cImg.width / Math.max(1, Math.floor(cImg.width / cImg.height));
                        ctx.drawImage(cImg, 0, 0, cW, cImg.height, cx + 50, floorY - 150, 100, 100);
                    }
                    
                    // Disegna sbarre laser della gabbia
                    ctx.strokeStyle = '#ff00ff'; ctx.lineWidth = 4; ctx.shadowBlur = 15; ctx.shadowColor = '#ff00ff';
                    for(let b=0; b<5; b++) {
                        ctx.beginPath(); ctx.moveTo(cx + (b*40), floorY - 180); ctx.lineTo(cx + (b*40), floorY - 20); ctx.stroke();
                    }
                    ctx.shadowBlur = 0;
                }

                // Pavimento Metro (Piastrelle)
                ctx.fillStyle = '#555'; ctx.fillRect(0, floorY, canvas.width, canvas.height - floorY);
                ctx.fillStyle = '#00ffff'; ctx.font = 'bold 80px VT323'; ctx.globalAlpha = 0.3;
                ctx.fillText("ZONA 3 - METRO", (bgScroll % 1000) + canvas.width, floorY + 80);
                ctx.globalAlpha = 1;
            }
        }

        // --- 4. MOTORE DELLA STORIA ---
        function directorLogic() {
            frameCount++;

            // --- SCENA 1: Camminata, Inseguimento e Magia ---
            if (scene === 1) {
                if (frameCount === 1) heroes.forEach(h => h.setState('walk'));
                
                // Arrivano le guardie!
                if (frameCount === 200) {
                    heroes.forEach(h => h.setState('run'));
                    for(let i=0; i<3; i++) cops.push(new Actor('cop', -100 - (i*80), canvas.height * 0.8, 1.2));
                }
                
                // Guardie inseguono
                if (frameCount > 200) cops.forEach(c => { c.setState('run'); c.x += 6; }); // Cops più veloci del bg
                
                // Sbuca Baba Jaga davanti!
                if (frameCount === 350) {
                    baba.visible = true; baba.setState('idle'); baba.flip = true; // Guarda verso gli eroi
                }
                if (frameCount > 350 && baba.x > canvas.width * 0.75) baba.x -= 4; // Entra in scena
                
                // BABA ATTACCA (MAGIA) E TELETRASPORTO
                if (frameCount === 450) baba.setState('attack');
                if (frameCount === 480) flashAlpha = 1.0; // FLASH BIANCO!
                if (frameCount === 490) { 
                    scene = 2; // CAMBIO SCENA
                    baba.visible = false; cops = []; 
                    for(let i=0; i<3; i++) cops.push(new Actor('copzombie', -100 - (i*80), canvas.height * 0.8, 1.2));
                }
            }

            // --- SCENA 2: Boschetto e Zombie ---
            else if (scene === 2) {
                if (flashAlpha > 0) flashAlpha -= 0.05; // Fade out flash
                heroes.forEach(h => h.setState('run'));
                // Gli zombie inseguono ma restano a distanza
                cops.forEach((c, i) => { 
                    c.setState('run'); 
                    let targetX = canvas.width * 0.05 + (i*60);
                    if (c.x < targetX) c.x += 2; 
                });

                // Teletrasporto alla 3
                if (frameCount === 900) flashAlpha = 1.0;
                if (frameCount === 910) { scene = 3; cops = []; }
            }

            // --- SCENA 3: Metro e Gabbie ---
            else if (scene === 3) {
                if (flashAlpha > 0) flashAlpha -= 0.05;
                heroes.forEach(h => h.setState('run'));
                // Sfondo gestito in drawBackgrounds. Solo corsa pura.

                // Teletrasporto alla 4
                if (frameCount === 1400) flashAlpha = 1.0;
                if (frameCount === 1410) { scene = 4; }
            }

            // --- SCENA 4: Furgone Extraction ---
            else if (scene === 4) {
                if (flashAlpha > 0) flashAlpha -= 0.05;
                
                // Si fermano al centro
                if (frameCount < 1600) {
                    heroes.forEach(h => h.setState('run'));
                } else if (frameCount === 1600) {
                    heroes.forEach(h => h.setState('idle'));
                    bgScroll = 0; // Fermiamo lo scorrimento del mondo
                }

                // Arriva il Furgone
                if (frameCount === 1650) { furgone.visible = true; furgone.setState('run'); }
                if (frameCount > 1650 && frameCount < 1750) furgone.x += 12; // Entra a palla
                
                // Frena e carica
                if (frameCount === 1750) { furgone.setState('idle'); }
                if (frameCount === 1800) heroes.forEach(h => h.visible = false); // Salgono su
                
                // Scappa via!
                if (frameCount === 1850) furgone.setState('run');
                if (frameCount > 1850) furgone.x += 15;

                // Loop Video
                if (frameCount > 2000) {
                    scene = 1; frameCount = 0; bgScroll = 0;
                    furgone.visible = false; furgone.x = -500;
                    heroes.forEach(h => h.visible = true);
                }
            }
        }

        // --- 5. RENDER FINALE ---
        function animazione() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            directorLogic();
            drawBackgrounds();

            // Disegna Entità
            cops.forEach(c => c.draw());
            baba.draw();
            furgone.draw();
            // Disegna gli eroi (sopra il furgone se c'è)
            heroes.forEach(h => h.draw());

            // Disegna Flash Bianco per le transizioni
            if (flashAlpha > 0) {
                ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            requestAnimationFrame(animazione);
        }

        // --- START ---
        loadAssets(() => {
            loadingText.style.display = 'none';
            console.log("Tutti gli asset caricati. CIAK, SI GIRA!");
            animazione();
        });

    </script>
</body>
</html>
